<!doctype html>
<html lang="$LANG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$PAGE_TITLE</title>
<style>
$CSS
</style>
</head>
<body>
<a class="skip" href="#content">$SKIP_LABEL</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">$SITE_TITLE</a>
    <span class="meta">$META</span>
    <button class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" onclick="var s=document.getElementById('sidebar');var o=s.classList.toggle('open');this.setAttribute('aria-expanded',o)">$MENU_LABEL</button>
  </div>
</header>
<div class="frame">
  <nav id="sidebar" class="sidebar" aria-label="$NAV_LABEL">
    $DOC_NAV
    $TOC
  </nav>
  <main id="content" class="content">
    $BODY
    <footer class="footer">
      $PREV_NEXT
      <p>$GENERATED_LABEL $DATE.</p>
    </footer>
  </main>
</div>
</body>
</html>
