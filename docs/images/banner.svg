<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="CodeAtlas: turn source code into user manuals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#123b6d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6aa9ef"/>
      <stop offset="1" stop-color="#57c27a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Left: code lines -->
  <g transform="translate(70 92)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
    <rect x="-18" y="-30" width="350" height="236" rx="14" fill="#0a1628" stroke="#2b4a73"/>
    <circle cx="2" cy="-12" r="5" fill="#f0776c"/><circle cx="20" cy="-12" r="5" fill="#e3b341"/><circle cx="38" cy="-12" r="5" fill="#57c27a"/>
    <text y="22" fill="#6aa9ef">router.<tspan fill="#e6e6e3">post</tspan>(<tspan fill="#a5d6a7">'/requests'</tspan>,</text>
    <text y="46" x="20" fill="#b393f5">requireRole<tspan fill="#e6e6e3">(</tspan><tspan fill="#a5d6a7">'requester'</tspan><tspan fill="#e6e6e3">),</tspan></text>
    <text y="70" x="20" fill="#e6e6e3">validate(schema),</text>
    <text y="94" x="20" fill="#e6e6e3">submit)</text>
    <text y="130" fill="#7d8b9c">// &lt;button&gt;Submit request&lt;/button&gt;</text>
    <text y="154" fill="#7d8b9c">// status: SUBMITTED → APPROVED</text>
    <text y="178" fill="#7d8b9c">// roles: requester · supervisor</text>
  </g>

  <!-- Middle: arrow -->
  <g transform="translate(432 200)">
    <path d="M0 0 H120" stroke="#6aa9ef" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
    <path d="M118 -10 L134 0 L118 10" fill="none" stroke="#57c27a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: title and manual card -->
  <g transform="translate(590 0)" font-family="Georgia, 'Times New Roman', serif">
    <text x="0" y="128" font-size="72" font-weight="700" fill="#ffffff">Code<tspan fill="url(#accent)">Atlas</tspan></text>
    <text x="2" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#c9d6e6">Turn source code into user manuals people can trust.</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
      <rect x="0" y="206" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#6aa9ef" stroke-opacity="0.6"/>
      <text x="90" y="231" text-anchor="middle" fill="#e6eef8">Every role found</text>
      <rect x="196" y="206" width="196" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#6aa9ef" stroke-opacity="0.6"/>
      <text x="294" y="231" text-anchor="middle" fill="#e6eef8">Traceable to code</text>
      <rect x="408" y="206" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#57c27a" stroke-opacity="0.7"/>
      <text x="498" y="231" text-anchor="middle" fill="#e6eef8">Nothing invented</text>
      <text x="2" y="300" font-size="17" fill="#8fa6c1">A skill for Claude · Markdown + HTML · 7-phase method</text>
    </g>
  </g>
</svg>
